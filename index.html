/* =========================================
RESET
========================================= */


*{
margin:0;
padding:0;
box-sizing:border-box;
}


html{

}

color:#f5f5f5;

}


a{

}



:root{

--black:#080808;

--dark:#111111;

--gold:#c9a227;

--gold-light:#e6c85c;

--gray:#a5a5a5;

--border:rgba(201,162,39,.3);

/* =========================================
NAVBAR
========================================= */


.navbar{

position:fixed;

top:0;

left:0;

width:100%;

height:78px;

z-index:9999;

display:flex;

align-items:center;

justify-content:space-between;

background:rgba(8,8,8,.98);

border-bottom:1px solid var(--border);

}



.logo{

display:flex;

align-items:center;

gap:12px;

}



.logo-mark{

width:44px;

height:44px;

display:flex;

align-items:center;

justify-content:center;

border:1px solid var(--gold);

color:var(--gold);

font-size:11px;

font-weight:bold;

letter-spacing:1px;

}



.logo-text{

display:flex;

flex-direction:column;

}



.logo-main{

font-size:12px;

font-weight:bold;

letter-spacing:2px;

}



.logo-sub{

letter-spacing:2px;

}



/* =========================================
NAVIGATION
========================================= */


.nav-menu{

}



.nav-menu a{

font-size:11px;

font-weight:bold;

letter-spacing:1.5px;

transition:.2s;

}



.nav-menu a:hover{

}



.nav-quote{

border:1px solid var(--gold);

padding:11px 18px;

}




/* =========================================
MOBILE MENU BUTTON
========================================= */


.menu-toggle{

display:none;

width:48px;

height:48px;

background:#080808;

border:1px solid var(--gold);

align-items:center;

justify-content:center;

flex-direction:column;

gap:5px;

cursor:pointer;

}



.menu-toggle span{

width:23px;

height:2px;

background:var(--gold);

display:block;

transition:.25s;

}



.menu-toggle.active span:nth-child(1){

transform:translateY(7px) rotate(45deg);

}



.menu-toggle.active span:nth-child(2){

opacity:0;

}



.menu-toggle.active span:nth-child(3){

transform:translateY(-7px) rotate(-45deg);

}

========================================= */


.hero{

align-items:center;

linear-gradient(

.eyebrow{

font-size:11px;

.hero-description{

.button{

border:1px solid var(--gold);

font-size:11px;

font-weight:bold;

letter-spacing:1.5px;

.button-gold{

.button-gold:hover{

.button-outline{

.hero-slogan{

.trust-bar{

.service-card-label{

.service-card h3{

.service-card p{

.service-card a{

/* =========================================

========================================= */


@media(max-width:900px){

<script>


const menuToggle = document.getElementById("menuToggle");

const navMenu = document.getElementById("navMenu");



menuToggle.addEventListener("click", function(){


menuToggle.classList.toggle("active");


navMenu.classList.toggle("active");


});





document.querySelectorAll(".nav-menu a").forEach(function(link){


link.addEventListener("click",function(){


menuToggle.classList.remove("active");


navMenu.classList.remove("active");


});


});



</script>
