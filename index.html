  <style>

    /* =========================================================
       ENHANCE MY RIDE — HOME PAGE
       Premium black + gold home-page components
    ========================================================= */

    :root {
      --gold: #d4af37;
      --gold-light: #e2c45b;
      --black: #050505;
      --surface: #0b0b0b;
      --white: #fff;
      --muted: rgba(255,255,255,.58);
      --border: rgba(255,255,255,.09);
    }


    /* =========================================================
       OPENING EXPERIENCE
    ========================================================= */

    .home-opening {
      position: fixed;
      inset: 0;
      z-index: 100000;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 90px 24px 75px;
      overflow: hidden;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.2),
          rgba(0,0,0,.88)
        ),
        radial-gradient(
          circle at center,
          rgba(201,162,39,.1),
          transparent 45%
        ),
        var(--black);

      opacity: 1;
      visibility: visible;

      transition:
        opacity .7s ease,
        visibility .7s ease;
    }

    .home-opening::before {
      content: "";

      position: absolute;

      width: 500px;
      height: 500px;

      top: -250px;
      left: 50%;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(201,162,39,.08),
          transparent 70%
        );

      pointer-events: none;
    }

    .home-opening::after {
      content: "";

      position: absolute;

      bottom: 0;
      left: 50%;

      width: min(180px,45vw);
      height: 1px;

      transform: translateX(-50%);

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
    }

    .home-opening.opening-complete {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .home-opening-content {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 760px;

      text-align: center;

      animation:
        homeHeroReveal 1.2s ease both;
    }

    @keyframes homeHeroReveal {

      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .home-brand-mark {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 4px;

      margin-bottom: 26px;
    }

    .home-brand-top {
      color: var(--gold-light);

      font:
        700 14px/1
        "Inter",
        Arial,
        sans-serif;

      letter-spacing: 7px;
    }

    .home-brand-main {
      color: var(--white);

      font:
        600
        clamp(43px,11vw,78px)/.95
        "Playfair Display",
        Georgia,
        serif;

      letter-spacing: 2px;
    }

    .home-brand-bottom {
      margin-top: 8px;

      color: #9a9a9a;

      font:
        600 8px/1
        "Inter",
        Arial,
        sans-serif;

      letter-spacing: 4px;
    }

    .home-gold-divider {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      margin: 0 auto 26px;
    }

    .home-gold-divider span {
      width: 42px;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--gold)
        );
    }

    .home-gold-divider span:last-child {
      background:
        linear-gradient(
          90deg,
          var(--gold),
          transparent
        );
    }

    .home-gold-divider i {
      width: 5px;
      height: 5px;

      border: 1px solid var(--gold);

      transform: rotate(45deg);
    }

    .home-opening-eyebrow {
      margin: 0 0 16px;

      color: var(--gold-light);

      font:
        700 10px/1
        "Inter",
        Arial,
        sans-serif;

      letter-spacing: 4px;
    }

    .home-opening-headline {
      margin: 0;

      color: var(--white);

      font:
        500
        clamp(34px,8vw,62px)/1.08
        "Playfair Display",
        Georgia,
        serif;

      letter-spacing: -.5px;
    }

    .home-opening-headline span,
    .home-final-cta h2 span {
      color: var(--gold-light);
    }

    .home-opening-description {
      max-width: 540px;

      margin: 24px auto 0;

      color: #9a9a9a;

      font:
        400 14px/1.8
        "Inter",
        Arial,
        sans-serif;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .home-hero {
      position: relative;

      min-height: 90svh;

      display: flex;
      align-items: center;

      overflow: hidden;

      background: var(--black);
    }

    .hero-slideshow {
      position: absolute;
      inset: 0;

      overflow: hidden;

      background: var(--black);
    }

    .hero-slide {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      opacity: 0;

      transform: scale(1.08);

      transition:
        opacity 1s ease,
        transform 7s ease;
    }

    .hero-slide.active {
      opacity: 1;
      transform: scale(1);
    }

    .hero-slideshow::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,.94),
          rgba(0,0,0,.67) 42%,
          rgba(0,0,0,.28) 72%,
          rgba(0,0,0,.56)
        );
    }

    .hero-slide-controls {
      position: absolute;

      left: 50%;
      bottom: 30px;

      z-index: 5;

      display: flex;

      gap: 8px;

      transform: translateX(-50%);
    }

    .hero-slide-dot {
      width: 7px;
      height: 7px;

      padding: 0;

      border:
        1px solid
        rgba(255,255,255,.65);

      border-radius: 50%;

      background: transparent;

      cursor: pointer;

      transition:
        width .3s ease,
        background .3s ease,
        border-color .3s ease;
    }

    .hero-slide-dot.active {
      width: 28px;

      border-radius: 20px;

      background: var(--gold);
      border-color: var(--gold);
    }


    /* =========================================================
       SHARED SECTION LAYOUTS
    ========================================================= */

    .home-intro,
    .home-transformations,
    .home-packages,
    .home-enhancements,
    .home-process,
    .home-reviews,
    .home-service-area {
      padding-block: 105px;
    }

    .home-intro-grid,
    .addon-grid,
    .service-area-home-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 70px;

      align-items: center;
    }

    .home-intro-grid {
      grid-template-columns:
        .8fr 1.2fr;

      align-items: end;
    }

    .home-intro h2 {
      margin-bottom: 0;

      font-size:
        clamp(2.6rem,5vw,5rem);

      line-height: .98;
    }

    .intro-large {
      margin-bottom: 18px;

      color: var(--white);

      font-size:
        clamp(1.35rem,2vw,1.8rem);

      line-height: 1.35;
    }

    .home-intro-grid > div:last-child p:not(.intro-large),
    .addon-grid > div:first-child p:not(.eyebrow),
    .service-area-home-grid > div:first-child p:not(.eyebrow) {
      color: var(--muted);

      line-height: 1.8;
    }

    .home-intro-grid > div:last-child p:not(.intro-large) {
      max-width: 680px;
    }


    /* =========================================================
       TRANSFORMATIONS
    ========================================================= */

    .transformation-preview-grid {
      display: grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap: 18px;
    }

    .transformation-preview {
      overflow: hidden;

      border:
        1px solid
        var(--border);

      background: var(--surface);
    }

    .home-gallery-image {
      position: relative;

      display: block;

      aspect-ratio: 4/3;

      overflow: hidden;
    }

    .home-gallery-image img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform .6s ease;
    }

    .transformation-preview:hover
    .home-gallery-image img {
      transform: scale(1.045);
    }

    .image-view-label {
      position: absolute;

      right: 15px;
      bottom: 15px;

      z-index: 2;

      padding: 8px 11px;

      border:
        1px solid
        rgba(255,255,255,.25);

      background:
        rgba(0,0,0,.55);

      color: var(--white);

      font-size: 8px;
      font-weight: 800;

      letter-spacing: .15em;
    }

    .transformation-preview-content {
      padding: 22px 23px 25px;
    }
